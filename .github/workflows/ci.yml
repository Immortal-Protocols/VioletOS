name: Build and test

# Kept to a few minutes: the seL4 build and host unit tests on Linux, and on
# macOS two QEMU tests (`make test-ci`). The other QEMU suites (make
# test-emulator, test-open, test-ladybird, test-shield, ...) run locally.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: seL4 build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler libxml2-utils ninja-build python3-venv
          rustup toolchain install 1.91.1 --profile minimal --target armv7a-none-eabi
          rustup override set 1.91.1
      - name: Build the QEMU image
        run: make qemu-image
      - name: Unit tests
        run: make test-unit

  mac:
    name: QEMU tests
    runs-on: macos-15
    timeout-minutes: 15
    env:
      # The two QEMU tests need Home, Stopwatch, Sounds and Weather; leave out
      # the apps that are slow to build, and skip whole-program optimisation.
      VIOLET_OPEN_SKIP: ladybird,music,canvas,hello
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install build and emulator tools
        run: |
          brew install dtc ninja qemu
          ndk_version=28.2.13676358
          if [[ ! -f "$ANDROID_HOME/ndk/$ndk_version/source.properties" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk_version"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
          rustup toolchain install 1.91.1 --profile minimal --target armv7a-none-eabi --target armv7-unknown-linux-musleabihf
          rustup override set 1.91.1
      - name: Cache the Rust apps' build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/cargo-home/registry
            build/open-cargo
          key: open-apps-${{ runner.os }}-1.91.1-${{ hashFiles('apps/Cargo.lock') }}
          restore-keys: open-apps-${{ runner.os }}-1.91.1-
      - name: QEMU tests (supervisor boot, open apps)
        run: make test-ci
