name: VioletRelay
options:
  bundleIdPrefix: com.immortal.violet
  deploymentTarget:
    iOS: "26.0"
packages:
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.5
settings:
  DEVELOPMENT_TEAM: 3UGCLFLDJ6
  CODE_SIGN_STYLE: Automatic
  SWIFT_VERSION: "5.0"
targets:
  VioletRelay:
    type: application
    platform: iOS
    sources:
      - App
      - Shield
      # Built by tools/shield-trainer/train.py; without them the Shield runs Tier 0 only.
      - path: ../../build/shield/VioletShieldEmbedder.mlpackage
        optional: true
      - path: ../../build/shield/VioletShieldHead.mlpackage
        optional: true
      - path: ../../build/shield/ShieldTokenizer
        type: folder
        optional: true
      - path: ../../build/shield/ShieldFixtures.json
        optional: true
    dependencies:
      - package: swift-transformers
        product: Tokenizers
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.immortal.violet.relay
      CODE_SIGN_ENTITLEMENTS: App/VioletRelay.entitlements
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Violet Relay
        NSLocalNetworkUsageDescription: >-
          Violet Relay accepts SOCKS5 connections from your VioletOS phone over
          Wi-Fi and forwards them over this iPhone's cellular data.
        NSBonjourServices: [_violetrelay._tcp]
        UIFileSharingEnabled: true
        UIBackgroundModes: [audio]
        LSSupportsOpeningDocumentsInPlace: true
  VioletRelayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: VioletRelay
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.immortal.violet.relay.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: VioletRelay
schemes:
  VioletRelay:
    build:
      targets:
        VioletRelay: all
        VioletRelayUITests: [test]
    test:
      targets: [VioletRelayUITests]
